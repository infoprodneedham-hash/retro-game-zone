<!DOCTYPE html>
<html>
<head>
    <title>Retro Arcade - Shooting Action</title>
    <style>
        body { background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        canvas { border: 4px solid #444; background: #5da1d1; box-shadow: 0 0 20px rgba(0,0,0,0.5); image-rendering: pixelated; }
        .ui { margin-bottom: 10px; font-size: 24px; text-transform: uppercase; width: 800px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="ui">
    <span>Score: <span id="score">0</span></span>
    <span>Lives: <span id="lives">3</span></span>
    <span>Action: [SPACE] JUMP [X] SHOOT</span>
</div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const livesElement = document.getElementById('lives');

// --- Audio ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, duration, volume = 0.1) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// --- Game Variables ---
const gravity = 0.5;
let score = 0;
let lives = 3;
let gameActive = true;
const keys = {};
let bullets = [];
let facing = 1; // 1 for right, -1 for left

document.addEventListener('keydown', e => { 
    keys[e.code] = true;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // Shoot Logic
    if (e.code === 'KeyX' || e.code === 'KeyF') {
        bullets.push({ x: player.x + (facing === 1 ? player.w : 0), y: player.y + 25, vx: facing * 7 });
        playSound(200, 'triangle', 0.1);
    }
});
document.addEventListener('keyup', e => keys[e.code] = false);

// --- Entities ---
const player = { x: 50, y: 400, w: 30, h: 50, vx: 0, vy: 0, speed: 4, jumpPower: -11, onGround: false, onLadder: false };
const platforms = [
    { x: 0, y: 520, w: 200, h: 80 },
    { x: 300, y: 400, w: 200, h: 20 },
    { x: 300, y: 250, w: 200, h: 20 },
    { x: 700, y: 450, w: 100, h: 150 }
];

let enemies = [
    { x: 310, y: 360, w: 30, h: 40, speed: 2, range: 150, startX: 310, dir: 1, alive: true }
];

const ladder = { x: 385, y: 250, w: 30, h: 150 };
const door = { x: 740, y: 390, w: 40, h: 60 };
const coin = { x: 390, y: 210, collected: false };
const elevator = { x: 550, y: 150, w: 100, h: 15, startY: 150, endY: 410, currentY: 150, speed: 2, hasPlayer: false };

function resetPlayer() { player.x = 50; player.y = 400; player.vx = 0; player.vy = 0; }

function update() {
    if (!gameActive) return;

    // Movement
    if (keys['ArrowLeft']) { player.vx = -player.speed; facing = -1; }
    else if (keys['ArrowRight']) { player.vx = player.speed; facing = 1; }
    else player.vx = 0;

    const centerX = player.x + player.w/2;
    player.onLadder = (centerX > ladder.x && centerX < ladder.x + ladder.w && player.y + player.h > ladder.y && player.y < ladder.y + ladder.h);

    if (player.onLadder) {
        player.vy = 0;
        if (keys['ArrowUp']) player.vy = -3;
        if (keys['ArrowDown']) player.vy = 3;
    } else {
        player.vy += gravity;
        if (keys['Space'] && player.onGround) { player.vy = player.jumpPower; player.onGround = false; playSound(400, 'square', 0.1); }
    }

    player.x += player.vx;
    player.y += player.vy;

    // Bullets
    bullets.forEach((b, i) => {
        b.x += b.vx;
        enemies.forEach(en => {
            if (en.alive && b.x > en.x && b.x < en.x + en.w && b.y > en.y && b.y < en.y + en.h) {
                en.alive = false;
                bullets.splice(i, 1);
                score += 50;
                scoreElement.innerText = score;
                playSound(100, 'sawtooth', 0.2, 0.2);
            }
        });
        if (b.x < 0 || b.x > 800) bullets.splice(i, 1);
    });

    // Enemy & Collision
    player.onGround = false; elevator.hasPlayer = false;
    [...platforms, elevator].forEach(p => {
        let py = (p === elevator) ? elevator.currentY : p.y;
        if (player.x + player.w > p.x && player.x < p.x + p.w && player.y + player.h > py && player.y + player.h < py + player.vy + 10) {
            player.y = py - player.h; player.vy = 0; player.onGround = true;
            if (p === elevator) elevator.hasPlayer = true;
        }
    });

    enemies.forEach(en => {
        if (!en.alive) return;
        en.x += en.speed * en.dir;
        if (en.x > en.startX + en.range || en.x < en.startX) en.dir *= -1;
        if (player.x < en.x + en.w && player.x + player.w > en.x && player.y < en.y + en.h && player.y + player.h > en.y) {
            lives--; livesElement.innerText = lives; playSound(150, 'sawtooth', 0.3);
            if (lives <= 0) { gameActive = false; alert("GAME OVER"); location.reload(); }
            else resetPlayer();
        }
    });

    if (elevator.hasPlayer) {
        if (elevator.currentY < elevator.endY) elevator.currentY += elevator.speed;
        player.y = elevator.currentY - player.h;
    } else if (elevator.currentY > elevator.startY) elevator.currentY -= elevator.speed;

    if (!coin.collected && Math.hypot(player.x - coin.x, player.y - coin.y) < 30) {
        coin.collected = true; score += 100; scoreElement.innerText = score; playSound(800, 'sine', 0.1);
    }

    if (player.x > door.x && player.y > door.y) {
        gameActive = false; playSound(600, 'square', 0.5);
        setTimeout(() => { alert("MISSION COMPLETE!"); location.reload(); }, 100);
    }

    if (player.y > canvas.height) { lives--; livesElement.innerText = lives; resetPlayer(); }

    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1e5d8b'; ctx.fillRect(0, 550, 800, 50);

    platforms.forEach(p => {
        ctx.fillStyle = '#5d4037'; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#8d6e63'; ctx.fillRect(p.x, p.y, p.w, 4);
    });

    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 3;
    ctx.strokeRect(ladder.x, ladder.y, ladder.w, ladder.h);
    for(let i=0; i<ladder.h; i+=20) { ctx.beginPath(); ctx.moveTo(ladder.x, ladder.y+i); ctx.lineTo(ladder.x+ladder.w, ladder.y+i); ctx.stroke(); }

    enemies.forEach(en => {
        if (en.alive) {
            ctx.fillStyle = '#d32f2f'; ctx.fillRect(en.x, en.y, en.w, en.h);
            ctx.fillStyle = 'yellow'; ctx.fillRect(en.x + (en.dir > 0 ? 20 : 5), en.y + 10, 5, 5);
        }
    });

    ctx.fillStyle = 'white';
    bullets.forEach(b => ctx.fillRect(b.x, b.y, 8, 4));

    ctx.fillStyle = '#fff'; ctx.fillRect(elevator.x, elevator.currentY, elevator.w, elevator.h);
    ctx.fillRect(elevator.x, elevator.currentY - 45, elevator.w, 5);

    if (!coin.collected) { ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(coin.x+15, coin.y+15, 8, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#3e2723'; ctx.fillRect(door.x, door.y, door.w, door.h);

    ctx.fillStyle = 'black'; ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = 'white'; ctx.fillRect(player.x+5, player.y+10, 20, 15);
    ctx.fillStyle = 'black'; ctx.fillRect(player.x-5, player.y, player.w+10, 8);

    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    for(let i=0; i<600; i+=4) ctx.fillRect(0, i, 800, 1);
}

update();
</script>
</body>
</html>
