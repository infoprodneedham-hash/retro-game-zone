<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blast into the past!!!</title>
    <style>
        /* Import an 8-bit retro font */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #0b0b1a;
            --text-color: #00ffcc;
            --card-bg: #16162c;
            --accent-color: #ff0055;
            --hero-border: #ffff00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
        }

        /* Subtle CRT scanline effect overlaid on the screen */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        header {
            text-align: center;
            padding: 3rem 1rem;
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 4px 4px 0 var(--accent-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); text-shadow: 4px 4px 0 var(--accent-color); }
            50% { transform: scale(1.02); text-shadow: 4px 4px 15px var(--accent-color); }
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem 4rem 2rem;
            position: relative;
            z-index: 10;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- Hero Section (Game 1) --- */
        .hero-card {
            display: block;
            width: 100%;
            height: 400px;
            /* Placeholder background - replace URL with your featured game image */
            background: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1200&q=80') center/cover;
            border: 4px solid var(--hero-border);
            border-radius: 8px;
            margin-bottom: 3rem;
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(255, 255, 0, 0.3);
        }

        .hero-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 100%);
        }

        .hero-card:hover {
            transform: scale(1.01);
            box-shadow: 0 0 25px var(--hero-border);
        }

        .hero-content {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            z-index: 2;
        }

        .hero-content h2 {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 0.8rem;
            text-shadow: 3px 3px 0 #000;
        }

        .badge {
            background: var(--hero-border);
            color: #000;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* --- Grid Section (Games 2-13) --- */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 2px solid #333;
            border-radius: 8px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            padding: 1rem;
        }

        .game-card:hover {
            border-color: var(--text-color);
            background-color: #1f1f3d;
            box-shadow: 0 0 15px var(--text-color);
            transform: translateY(-5px);
        }

        .game-card span {
            font-size: 0.9rem;
            line-height: 1.4;
            z-index: 2;
        }

        /* --- Retro Icons Background --- */
        #retro-icons {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .icon {
            position: absolute;
            opacity: 0.15;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-20vh) rotate(360deg); }
        }

        /* --- Responsive Design --- */
        @media (max-width: 1024px) {
            .game-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.5rem;
            }
            .hero-card {
                height: 300px;
            }
            .hero-content h2 {
                font-size: 1.3rem;
            }
            .game-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            .game-grid {
                grid-template-columns: 1fr;
            }
            header h1 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Container for random JS generated icons -->
    <div id="retro-icons"></div>

    <header>
        <h1>Blast into the past!!!</h1>
    </header>

    <main>
        <!-- Featured Game (Link 1) -->
        <a href="/four/index.html" class="hero-card">
            <div class="hero-content">
                <span class="badge">Insert Coin</span>
                <h2>Featured Retro Title - Flight Risk</h2>
            </div>
        </a>

        <!-- Grid for Games 2 to 13 -->
        <div class="game-grid">
            <a href="/two/index.html" class="game-card"><span>Cool Pool</span></a>
            <a href="/three/index.html" class="game-card"><span>Dart Fun</span></a>
            <a href="/one/index.html" class="game-card"><span>Tap Hoops</span></a>
            <a href="/five/index.html" class="game-card"><span>Space Jet</span></a>
            <a href="/six/index.html" class="game-card"><span>Launch Guy</span></a>
            <a href="/seven/index.html" class="game-card"><span>Pin Ball</span></a>
            <a href="/eight/index.html" class="game-card"><span>Night Scope</span></a>
            <a href="/nine/index.html" class="game-card"><span>Target Practice</span></a>
            <a href="/ten/index.html" class="game-card"><span>Robo Spy</span></a>
            <a href="/eleven/index.html" class="game-card"><span>Star Ship</span></a>
            <a href="/twelve/index.html" class="game-card"><span>Jump And Dash</span></a>
            <a href="/thirteen/index.html" class="game-card"><span>Sword Wars</span></a>
        </div>
    </main>

    <script>
        // --- Retro Background Icon Generator ---
        const iconsContainer = document.getElementById('retro-icons');
        // Array of classic arcade-style emojis to act as characters
        const icons = ['👾', '👻', '🛸', '🍒', '🚀', '🍄', '💎', '🕹️', '💣'];
        
        function createIcon() {
            const iconElement = document.createElement('div');
            iconElement.classList.add('icon');
            
            // Randomly select an icon character
            iconElement.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            // Randomize styling (Size, X-Position)
            const size = Math.random() * 2.5 + 1.5; // Between 1.5rem and 4rem
            iconElement.style.fontSize = `${size}rem`;
            iconElement.style.left = `${Math.random() * 100}vw`;
            
            // Randomize floating speed to simulate depth (slower = further away)
            const duration = Math.random() * 12 + 8; // Between 8s and 20s
            iconElement.style.animationDuration = `${duration}s`;
            
            // Append to DOM
            iconsContainer.appendChild(iconElement);
            
            // Remove the DOM element once it floats off the top of the screen
            setTimeout(() => {
                iconElement.remove();
            }, duration * 1000);
        }

        // Initially populate the screen with a few icons
        for (let i = 0; i < 12; i++) {
            setTimeout(createIcon, Math.random() * 3000);
        }

        // Keep spawning new icons continuously
        setInterval(createIcon, 1500);
    </script>
</body>
</html>
