<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RETRO-FORGE 1982 // Authentic 8-Bit Arcade & Standalone Maker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --crt-scanline: rgba(18, 16, 16, 0.45);
      --arcade-gold: #fbbf24;
      --arcade-cyan: #22d3ee;
      --arcade-green: #4ade80;
    }

    body {
      font-family: 'Share Tech Mono', monospace;
      background-color: #06080e;
      color: #e2e8f0;
      user-select: none;
      overflow-x: hidden;
    }

    .retro-font {
      font-family: 'Press Start 2P', monospace;
      letter-spacing: -0.5px;
    }

    .scanlines-overlay {
      position: relative;
    }
    .scanlines-overlay::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(var(--crt-scanline) 50%, rgba(0, 0, 0, 0.5) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 25;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      opacity: 0.9;
    }

    .arcade-bezel {
      box-shadow: inset 0 0 70px rgba(0, 0, 0, 0.95), 0 0 25px rgba(34, 211, 238, 0.25);
      border: 3px solid #1e293b;
    }

    .neon-text-gold {
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.8), 0 0 16px rgba(251, 191, 36, 0.35);
    }
    .neon-text-cyan {
      text-shadow: 0 0 8px rgba(34, 211, 238, 0.8), 0 0 16px rgba(34, 211, 238, 0.35);
    }

    /* Virtual Controls Styling */
    .vpad-btn {
      touch-action: manipulation;
      user-select: none;
      transition: all 0.08s ease;
    }
    .vpad-btn:active, .vpad-btn.pressed {
      transform: scale(0.92);
      filter: brightness(1.3);
    }
  </style>
</head>

<body class="min-h-screen flex flex-col bg-[#05070c] text-slate-200">
  <header class="border-b border-slate-800 bg-[#0a0f1d] px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 shadow-lg z-30">
    <div class="flex items-center gap-3">
      <div class="w-3.5 h-3.5 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_10px_#22d3ee]"></div>
      <div>
        <h1 class="retro-font text-xs sm:text-sm text-cyan-300 neon-text-cyan flex items-center gap-2">
          <span>🕹️</span> RETRO-FORGE 1982 <span class="text-[9px] bg-slate-800 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded">CALIBRATED v5.0</span>
        </h1>
        <p class="text-[11px] text-slate-400">Space Invaders • Frogger • Pac-Man • Donkey Kong • Elevator Action</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="sfxBtn" onclick="toggleAudio()" class="px-3 py-1 text-xs bg-slate-900 border border-slate-700 hover:border-cyan-500 text-cyan-300 rounded transition flex items-center gap-1.5">
        <span id="sfxIcon">🔊</span> <span id="sfxLabel">SFX: ON</span>
      </button>

      <button id="crtBtn" onclick="toggleCrtScanlines()" class="px-3 py-1 text-xs bg-slate-900 border border-slate-700 hover:border-amber-500 text-amber-300 rounded transition">
        CRT: ON
      </button>

      <button onclick="randomizeSettings()" class="px-3 py-1 text-xs bg-amber-950/80 hover:bg-amber-900 border border-amber-500 text-amber-300 font-bold rounded transition flex items-center gap-1 shadow-[0_0_10px_rgba(245,158,11,0.25)]">
        <span>⚡</span> REMIX PRESET
      </button>
    </div>
  </header>

  <main class="flex-1 grid grid-cols-1 xl:grid-cols-12 gap-4 p-3 md:p-5 max-w-[1780px] w-full mx-auto">
    <!-- LEFT PANEL: Game Selector, AI Prompt Generator & Rule Customizer -->
    <section class="xl:col-span-5 flex flex-col gap-3.5 bg-[#0a0f1d] border border-slate-800 rounded-lg p-4 shadow-2xl">
      <!-- Game Selector Tabs -->
      <div>
        <label class="block text-[11px] font-bold text-cyan-400 mb-2 uppercase tracking-wider flex items-center justify-between">
          <span>SELECT CLASSIC ARCADE ENGINE</span>
          <span class="text-[10px] text-emerald-400 font-mono">100% OFFLINE STANDALONE</span>
        </label>
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-1.5">
          <button onclick="selectClassicGame('invaders')" id="tab-invaders" class="game-tab py-2 px-1 text-[10px] retro-font text-center rounded border border-cyan-500 bg-cyan-950/70 text-cyan-200 transition shadow">
            INVADERS
          </button>
          <button onclick="selectClassicGame('frogger')" id="tab-frogger" class="game-tab py-2 px-1 text-[10px] retro-font text-center rounded border border-slate-800 bg-slate-900/80 text-slate-400 transition hover:border-slate-600">
            FROGGER
          </button>
          <button onclick="selectClassicGame('pacman')" id="tab-pacman" class="game-tab py-2 px-1 text-[10px] retro-font text-center rounded border border-slate-800 bg-slate-900/80 text-slate-400 transition hover:border-slate-600">
            PAC-MAZE
          </button>
          <button onclick="selectClassicGame('kong')" id="tab-kong" class="game-tab py-2 px-1 text-[10px] retro-font text-center rounded border border-slate-800 bg-slate-900/80 text-slate-400 transition hover:border-slate-600">
            KONG
          </button>
          <button onclick="selectClassicGame('elevator')" id="tab-elevator" class="game-tab py-2 px-1 text-[10px] retro-font text-center rounded border border-slate-800 bg-slate-900/80 text-slate-400 transition hover:border-slate-600">
            ELEVATOR
          </button>
        </div>
      </div>

      <!-- Config Controls -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
        <div>
          <label class="block text-slate-300 font-bold mb-1">🏷️ CARTRIDGE TITLE</label>
          <input type="text" id="cfgTitle" class="w-full bg-[#060a14] border border-slate-700 rounded px-2.5 py-1.5 text-cyan-200 focus:outline-none focus:border-cyan-400" oninput="onConfigChange()">
        </div>

        <div>
          <label class="block text-slate-300 font-bold mb-1">🎨 COLOR PALETTE</label>
          <select id="cfgPalette" onchange="onConfigChange()" class="w-full bg-[#060a14] border border-slate-700 rounded px-2.5 py-1.5 text-cyan-200 focus:outline-none">
            <option value="original">Arcade Authentic (1980-83)</option>
            <option value="matrix">Phosphor Matrix (Emerald Green)</option>
            <option value="amber">1982 Amber CRT Terminal</option>
            <option value="cyberpunk">Cyberpunk Neon (Magenta / Cyan)</option>
            <option value="gameboy">1989 Dot Matrix Green (Handheld)</option>
          </select>
        </div>

        <div>
          <label class="block text-slate-300 font-bold mb-1">💀 DIFFICULTY</label>
          <select id="cfgDifficulty" onchange="onConfigChange()" class="w-full bg-[#060a14] border border-slate-700 rounded px-2.5 py-1.5 text-cyan-200 focus:outline-none">
            <option value="arcade">Arcade Standard (Quarter Muncher)</option>
            <option value="casual">Casual (Generous Lives / Relaxed)</option>
            <option value="turbo">Turbo 1985 (High Velocity)</option>
          </select>
        </div>

        <div>
          <label class="block text-slate-300 font-bold mb-1">⚡ BONUS MECHANIC</label>
          <select id="cfgMod" onchange="onConfigChange()" class="w-full bg-[#060a14] border border-slate-700 rounded px-2.5 py-1.5 text-cyan-200 focus:outline-none">
            <option value="classic">Faithful Classic Rules</option>
            <option value="doublescore">Double Scoring Fever</option>
            <option value="speedshoes">Speed Boost Active</option>
          </select>
        </div>
      </div>

      <!-- Specific Engine Tuning Summary -->
      <div id="physicsTuningSummary" class="text-[11px] bg-[#070d18] border border-slate-700/80 rounded p-2.5 text-slate-300 space-y-1">
        <!-- Injected details -->
      </div>

      <!-- Generated AI Prompt Output -->
      <div class="flex-1 flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <label class="text-xs text-amber-400 font-bold flex items-center gap-1.5">
            <span>✨</span> AI CODING PROMPT (ENGINEER SPEC)
          </label>
          <button onclick="copyAiPrompt()" class="text-[11px] text-amber-300 bg-amber-950/80 hover:bg-amber-900 border border-amber-600/70 px-2 py-0.5 rounded transition">
            📋 COPY PROMPT
          </button>
        </div>
        <textarea id="aiPromptBox" rows="4" readonly class="w-full bg-[#050811] border border-slate-700 rounded p-2.5 text-[11px] text-slate-300 font-mono leading-relaxed resize-none focus:outline-none select-all"></textarea>
      </div>

      <!-- Export & Build Tools -->
      <div class="pt-2 border-t border-slate-800 flex flex-col gap-2">
        <button onclick="loadGameIntoSandbox()" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold text-xs retro-font tracking-wider rounded transition shadow-[0_0_15px_rgba(6,182,212,0.4)] flex items-center justify-center gap-2">
          <span>🕹️</span> APPLY & RUN IN PREVIEW
        </button>

        <div class="grid grid-cols-2 gap-2">
          <button onclick="downloadStandaloneGameFile()" class="py-2.5 px-3 bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-xs rounded border border-emerald-500 transition shadow flex items-center justify-center gap-1.5">
            <span>💾</span> DOWNLOAD .HTML
          </button>
          <button onclick="copyGameSourceCode()" class="py-2.5 px-3 bg-slate-900 hover:bg-slate-800 text-cyan-300 font-bold text-xs rounded border border-slate-700 transition flex items-center justify-center gap-1.5">
            <span id="copyCodeIcon">📄</span> <span id="copyCodeText">COPY HTML CODE</span>
          </button>
        </div>

        <div class="text-[11px] text-slate-400 bg-slate-900/60 p-2 rounded border border-slate-800 flex items-start gap-2">
          <span class="text-amber-400 text-sm">💡</span>
          <div>
            The downloaded game is a <strong class="text-cyan-300">100% standalone offline file</strong> with zero external dependencies. Save it into your <strong class="text-amber-300">Games</strong> folder and double-click to play immediately!
          </div>
        </div>
      </div>
    </section>

    <!-- RIGHT PANEL: Live Playable Arcade Cabinet Preview -->
    <section class="xl:col-span-7 flex flex-col gap-2.5 bg-[#080d19] border border-slate-800 rounded-lg p-3 md:p-4 shadow-2xl">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-2">
        <div class="flex items-center gap-2">
          <span class="text-xs bg-cyan-950 text-cyan-300 px-2 py-0.5 rounded border border-cyan-700">CANVAS VIEWPORT</span>
          <h2 id="activeGameTitleBadge" class="retro-font text-xs text-amber-300">SPACE INVADERS 1978</h2>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="restartActiveGame()" class="px-2.5 py-1 text-xs bg-slate-900 hover:bg-slate-800 text-cyan-300 border border-slate-700 rounded transition flex items-center gap-1">
            <span>🔄</span> RESET
          </button>
          <button onclick="toggleActivePause()" id="pauseBtn" class="px-2.5 py-1 text-xs bg-slate-900 hover:bg-slate-800 text-cyan-300 border border-slate-700 rounded transition flex items-center gap-1">
            <span>⏸️</span> PAUSE
          </button>
          <button onclick="togglePreviewFullscreen()" class="px-2.5 py-1 text-xs bg-slate-900 hover:bg-slate-800 text-cyan-300 border border-slate-700 rounded transition flex items-center gap-1">
            <span>⛶</span> FULLSCREEN
          </button>
        </div>
      </div>

      <!-- Live Canvas Arcade Screen -->
      <div id="screenWrapper" class="scanlines-overlay relative w-full aspect-square max-w-[600px] mx-auto bg-black rounded-lg overflow-hidden arcade-bezel flex items-center justify-center">
        <canvas id="arcadeCanvas" width="600" height="600" class="w-full h-full block bg-black"></canvas>
      </div>

      <!-- Virtual Controls for Mobile / Touch / Mouse -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-[#060a14] border border-slate-800 p-2.5 rounded-lg text-xs">
        <!-- D-Pad -->
        <div class="flex items-center justify-center gap-1.5">
          <div class="grid grid-cols-3 gap-1.5 w-36">
            <div></div>
            <button id="vbtn-up" class="vpad-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded p-2 text-cyan-300 font-bold text-center">↑</button>
            <div></div>
            <button id="vbtn-left" class="vpad-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded p-2 text-cyan-300 font-bold text-center">←</button>
            <button id="vbtn-down" class="vpad-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded p-2 text-cyan-300 font-bold text-center">↓</button>
            <button id="vbtn-right" class="vpad-btn bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded p-2 text-cyan-300 font-bold text-center">→</button>
          </div>
        </div>

        <!-- Action Buttons & Status -->
        <div class="flex flex-col justify-between gap-2">
          <div class="flex items-center justify-around gap-2">
            <button id="vbtn-action" class="vpad-btn flex-1 py-3 px-4 bg-red-800 hover:bg-red-700 border border-red-500 rounded text-amber-200 font-bold retro-font text-[10px] text-center shadow-[0_0_10px_rgba(239,68,68,0.3)]">
              ACTION (SPACE)
            </button>
          </div>
          <div id="controlsBanner" class="text-[11px] text-slate-300 flex items-center justify-between">
            <!-- Dynamically populated key guides -->
          </div>
        </div>
      </div>

      <!-- Toast Feedback -->
      <div id="toast" class="hidden text-xs py-2 px-3 rounded bg-cyan-950 border border-cyan-500 text-cyan-200 transition-all text-center"></div>
    </section>
  </main>

  <script>
    let audioCtx = null;
    let sfxEnabled = true;
    let crtEnabled = true;
    let currentGame = 'invaders';
    let isPaused = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(freq, type = 'square', duration = 0.06, vol = 0.1) {
      if (!sfxEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function toggleAudio() {
      sfxEnabled = !sfxEnabled;
      document.getElementById('sfxIcon').innerText = sfxEnabled ? '🔊' : '🔇';
      document.getElementById('sfxLabel').innerText = sfxEnabled ? 'SFX: ON' : 'SFX: OFF';
      if (sfxEnabled) playBeep(600, 'triangle', 0.08);
    }

    function toggleCrtScanlines() {
      crtEnabled = !crtEnabled;
      const screen = document.getElementById('screenWrapper');
      const btn = document.getElementById('crtBtn');
      if (crtEnabled) {
        screen.classList.add('scanlines-overlay');
        btn.innerText = 'CRT: ON';
      } else {
        screen.classList.remove('scanlines-overlay');
        btn.innerText = 'CRT: OFF';
      }
      playBeep(440, 'square', 0.05);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2800);
    }

    const ARCADE_METADATA = {
      invaders: {
        id: 'invaders',
        name: 'SPACE INVADERS 1978',
        controlsHtml: `<span><strong class="text-cyan-400">MOVE:</strong> ← / → or A / D</span> <span><strong class="text-amber-400">FIRE:</strong> Spacebar</span>`,
        tuningNotes: `
          <div class="text-amber-400 font-bold">✓ Calibrated Space Invaders Engine:</div>
          <div>• 4 Destructible Arch Bunkers that erode from player lasers, enemy bombs, and alien collisions.</div>
          <div>• 5x8 Marching Alien Formation with edge-bounce dropping and dynamic tempo acceleration.</div>
          <div>• Flying Mystery UFO at screen ceiling awarding bonus points when sniped.</div>
        `,
        promptTheme: "Space Invaders arcade shooter with marching 5x8 alien grid, 4 destructible green pixel-mesh bunkers, bottom player laser cannon, top flying saucer UFO, and retro chiptune SFX."
      },
      frogger: {
        id: 'frogger',
        name: 'FROGGER: HOPPING RUN 1981',
        controlsHtml: `<span><strong class="text-cyan-400">HOP:</strong> Arrow Keys / WASD</span> <span><strong class="text-amber-400">GOAL:</strong> 5 Open Top Docks</span>`,
        tuningNotes: `
          <div class="text-amber-400 font-bold">✓ Calibrated Frogger Engine:</div>
          <div>• 5 Open Lily-Pad Top Docks with hedge dividers; landing in a free bay scores +500 and saves a frog.</div>
          <div>• Halved obstacle movement speeds across all highway and river lanes for fair rhythm.</div>
          <div>• Wide spacing on cars and logs with smooth log-riding drift and water drowning detection.</div>
        `,
        promptTheme: "Frogger arcade game with 5 top goal lily-pad docks, hedge barriers, halved vehicle & river speeds, wide gaps, floating logs/turtles with horizontal drift, and median rest zones."
      },
      pacman: {
        id: 'pacman',
        name: 'PAC-MAZE 1980',
        controlsHtml: `<span><strong class="text-cyan-400">MOVE:</strong> Arrows / WASD</span> <span><strong class="text-amber-400">REVERSE:</strong> Instant 180°</span>`,
        tuningNotes: `
          <div class="text-amber-400 font-bold">✓ Calibrated Pac-Man Engine:</div>
          <div>• Absolute Screen-Relative Cardinal Controls with instant 180° reversing and corner snap buffering.</div>
          <div>• Staggered Ghost House Emergence: Pinky, Inky, Clyde step out in sequence; Blinky starts outside.</div>
          <div>• Dynamic Cruise Elroy ghost acceleration from 1.8 to 3.2 px/frame as dots are cleared.</div>
        `,
        promptTheme: "Pac-Man arcade maze with absolute screen-relative cardinal inputs, continuous non-stalling ghost movement with staggered house departures, progressive Elroy speed ramping, corridor gravitation pursuit, and chiptune sound effects."
      },
      kong: {
        id: 'kong',
        name: 'BARREL CLIMBER 1981 (DONKEY KONG)',
        controlsHtml: `<span><strong class="text-cyan-400">RUN:</strong> ← / →</span> <span><strong class="text-amber-400">CLIMB:</strong> ↑ / ↓</span> <span><strong class="text-emerald-400">JUMP:</strong> Space</span>`,
        tuningNotes: `
          <div class="text-amber-400 font-bold">✓ Calibrated Donkey Kong Engine:</div>
          <div>• Barrels strictly roll down inclined red girders and drop vertically at girder edges to the tier below.</div>
          <div>• Mario has parabolic jump physics, gravity, and climbs ladders only when aligned.</div>
        `,
        promptTheme: "Donkey Kong girder climbing game with sloping steel girders, rolling barrels dropping down tiers, Mario jumping over barrels, climbing ladders, and rescuing Pauline at top."
      },
      elevator: {
        id: 'elevator',
        name: 'ELEVATOR ACTION: SPY 1983',
        controlsHtml: `<span><strong class="text-cyan-400">RUN:</strong> A / D</span> <span><strong class="text-amber-400">ELEVATOR / ENTER:</strong> W / S</span> <span><strong class="text-emerald-400">DUCK/SHOOT:</strong> S to Duck, Space to Fire</span>`,
        tuningNotes: `
          <div class="text-amber-400 font-bold">✓ Calibrated Elevator Action Engine:</div>
          <div>• Continuous elevator shafts; step into elevators and use UP/DOWN to travel between floors.</div>
          <div>• Press UP in front of red doors to search documents and exit at the identical spot (no teleporting).</div>
          <div>• Ducking under enemy bullets and eliminating patrolling agent spies.</div>
        `,
        promptTheme: "Elevator Action espionage game with continuous vertical elevator shafts, searching red document rooms exiting at identical location, ducking under bullets, and shooting enemy agents."
      }
    };

    function selectClassicGame(gameKey) {
      currentGame = gameKey;
      playBeep(750, 'square', 0.05);

      document.querySelectorAll('.game-tab').forEach(b => {
        b.className = 'game-tab py-2 px-1 text-[10px] retro-font text-center rounded border border-slate-800 bg-slate-900/80 text-slate-400 transition hover:border-slate-600';
      });
      const activeBtn = document.getElementById('tab-' + gameKey);
      if (activeBtn) {
        activeBtn.className = 'game-tab py-2 px-1 text-[10px] retro-font text-center rounded border border-cyan-500 bg-cyan-950/70 text-cyan-200 transition shadow';
      }

      const meta = ARCADE_METADATA[gameKey];
      document.getElementById('cfgTitle').value = meta.name;
      document.getElementById('activeGameTitleBadge').innerText = meta.name;
      document.getElementById('controlsBanner').innerHTML = meta.controlsHtml;
      document.getElementById('physicsTuningSummary').innerHTML = meta.tuningNotes;

      updateAiPromptDisplay();
      initSelectedEngine();
    }

    function onConfigChange() {
      updateAiPromptDisplay();
      initSelectedEngine();
    }

    function updateAiPromptDisplay() {
      const meta = ARCADE_METADATA[currentGame];
      const title = document.getElementById('cfgTitle').value || meta.name;
      const palette = document.getElementById('cfgPalette').value;
      const diff = document.getElementById('cfgDifficulty').value;
      const mod = document.getElementById('cfgMod').value;

      const prompt = `Create a single-file, 100% self-contained HTML5 retro arcade game titled "${title}".
Classic Engine: ${meta.name}
Core Gameplay Mechanics & Calibrations:
- ${meta.promptTheme}
- Aesthetic & Color Palette: ${palette.toUpperCase()}
- Difficulty Setting: ${diff.toUpperCase()}
- Bonus Modifier: ${mod.toUpperCase()}
Key Engine Rules:
1. Space Invaders: 4 destructible multi-block green defense bunkers that erode from laser/bomb impacts. Marching 5x8 alien armada with edge drop and speed escalation. Top flying red mystery saucer UFO.
2. Frogger: 5 open lily-pad bays with hedge barriers at top. Halved vehicle and river speeds with generous gaps. Log-riding horizontal drift and water drowning collision.
3. Pac-Man: Absolute screen-relative movement, instant 180° reversing, corner buffering. Continuous ghost movement, staggered departures, and progressive Cruise Elroy acceleration.
4. Donkey Kong: Barrels roll strictly down girder inclines and drop down at girder edges to the next tier below.
5. Elevator Action: Authentic continuous elevator shafts, zero door teleportation (enter and exit red secret rooms at identical position), ducking under bullets.
6. Web Audio API synthesized chiptune SFX with zero external image or audio URLs. Fully self-contained.`;

      document.getElementById('aiPromptBox').value = prompt;
    }

    function copyAiPrompt() {
      playBeep(880, 'square', 0.06);
      const box = document.getElementById('aiPromptBox');
      box.select();
      document.execCommand('copy');
      showToast('📋 AI prompt copied to clipboard!');
    }

    function randomizeSettings() {
      playBeep(400, 'square', 0.05);
      setTimeout(() => playBeep(700, 'square', 0.05), 60);
      const keys = ['invaders', 'frogger', 'pacman', 'kong', 'elevator'];
      const pick = keys[Math.floor(Math.random() * keys.length)];
      
      const palettes = ['original', 'matrix', 'amber', 'cyberpunk', 'gameboy'];
      const diffs = ['arcade', 'casual', 'turbo'];
      const mods = ['classic', 'doublescore', 'speedshoes'];

      document.getElementById('cfgPalette').value = palettes[Math.floor(Math.random() * palettes.length)];
      document.getElementById('cfgDifficulty').value = diffs[Math.floor(Math.random() * diffs.length)];
      document.getElementById('cfgMod').value = mods[Math.floor(Math.random() * mods.length)];

      selectClassicGame(pick);
      showToast('⚡ Preset randomized!');
    }
  </script>

  <script>
    const canvas = document.getElementById('arcadeCanvas');
    const ctx = canvas.getContext('2d');

    // Input States
    const keys = {};
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) {
        e.preventDefault();
      }
      if (k === 'p') toggleActivePause();
      if (activeGameOver && (k === ' ' || k === 'r')) restartActiveGame();

      if (currentGame === 'pacman') handlePacmanInput(k);
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // Touch Virtual D-Pad bindings
    function bindVpad(elemId, keyMap) {
      const btn = document.getElementById(elemId);
      if (!btn) return;
      const setKey = (val) => {
        keyMap.forEach(k => keys[k] = val);
        if (val) {
          btn.classList.add('pressed');
          if (currentGame === 'pacman') handlePacmanInput(keyMap[0]);
        } else {
          btn.classList.remove('pressed');
        }
      };
      btn.addEventListener('touchstart', e => { e.preventDefault(); setKey(true); });
      btn.addEventListener('touchend', e => { e.preventDefault(); setKey(false); });
      btn.addEventListener('mousedown', e => { e.preventDefault(); setKey(true); });
      btn.addEventListener('mouseup', e => { e.preventDefault(); setKey(false); });
      btn.addEventListener('mouseleave', () => setKey(false));
    }

    bindVpad('vbtn-up', ['arrowup', 'w']);
    bindVpad('vbtn-down', ['arrowdown', 's']);
    bindVpad('vbtn-left', ['arrowleft', 'a']);
    bindVpad('vbtn-right', ['arrowright', 'd']);
    bindVpad('vbtn-action', [' ']);

    // Active Global Game State
    let activeScore = 0;
    let activeHiScore = 5000;
    let activeLives = 3;
    let activeGameOver = false;

    function getColorPalette() {
      const p = document.getElementById('cfgPalette').value;
      const schemes = {
        original: { bg: '#000000', border: '#2563eb', wall: '#1d4ed8', player: '#facc15', enemy: '#ef4444', bunker: '#22c55e', accent: '#38bdf8', text: '#f8fafc' },
        matrix: { bg: '#020d04', border: '#22c55e', wall: '#15803d', player: '#4ade80', enemy: '#86efac', bunker: '#4ade80', accent: '#a7f3d0', text: '#bbf7d0' },
        amber: { bg: '#120800', border: '#f59e0b', wall: '#b45309', player: '#fbbf24', enemy: '#f97316', bunker: '#f59e0b', accent: '#fde68a', text: '#fef3c7' },
        cyberpunk: { bg: '#0b0217', border: '#f43f5e', wall: '#9333ea', player: '#06b6d4', enemy: '#f43f5e', bunker: '#06b6d4', accent: '#fbbf24', text: '#fbcfe8' },
        gameboy: { bg: '#1c2817', border: '#606c38', wall: '#283618', player: '#dda15e', enemy: '#bc6c25', bunker: '#8f9a27', accent: '#fefae0', text: '#fefae0' }
      };
      return schemes[p] || schemes.original;
    }

    /* =========================================================================
       ENGINE 1: SPACE INVADERS (DESTRUCTIBLE BUNKERS, MARCHING ALIENS, UFO)
    ========================================================================= */
    let invPlayer = { x: 285, y: 550, w: 30, h: 16 };
    let invMissiles = [];
    let invAliens = [];
    let invAlienDir = 1;
    let invAlienTimer = 0;
    let invUfo = null;
    let invUfoTimer = 0;
    let invBunkers = [];

    function initSpaceInvadersEngine() {
      invPlayer.x = 285;
      invMissiles = [];
      invAliens = [];
      invAlienDir = 1;
      invAlienTimer = 0;
      invUfo = null;
      invUfoTimer = 0;

      // 5 Rows x 8 Columns of classic aliens
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 8; c++) {
          invAliens.push({
            x: 80 + c * 56,
            y: 80 + r * 38,
            w: 26,
            h: 20,
            type: r,
            score: (5 - r) * 10
          });
        }
      }

      // Build 4 Destructible Arch Bunkers
      invBunkers = [];
      const bunkerXPos = [70, 205, 340, 475];
      const bunkerW = 55;
      const bunkerH = 40;
      const blockSize = 5;

      bunkerXPos.forEach(bx => {
        const blocks = [];
        const cols = Math.floor(bunkerW / blockSize);
        const rows = Math.floor(bunkerH / blockSize);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            // Cut out archway at bottom center
            if (r >= rows - 3 && c >= 3 && c <= cols - 4) continue;
            // Cut out top corners for rounded arcade bunker look
            if (r === 0 && (c === 0 || c === cols - 1)) continue;

            blocks.push({
              x: bx + c * blockSize,
              y: 470 + r * blockSize,
              w: blockSize,
              h: blockSize,
              alive: true
            });
          }
        }
        invBunkers.push({ blocks });
      });
    }

    function updateSpaceInvaders() {
      const spd = 4.2;
      if (keys['arrowleft'] || keys['a']) invPlayer.x -= spd;
      if (keys['arrowright'] || keys['d']) invPlayer.x += spd;
      invPlayer.x = Math.max(20, Math.min(550, invPlayer.x));

      // Player laser fire
      if (keys[' '] && invMissiles.filter(m => m.fromPlayer).length === 0) {
        invMissiles.push({
          x: invPlayer.x + invPlayer.w / 2 - 2,
          y: invPlayer.y - 6,
          vy: -8,
          w: 4,
          h: 12,
          fromPlayer: true
        });
        playBeep(880, 'square', 0.05, 0.09);
      }

      // Marching Aliens movement & speed escalation
      invAlienTimer++;
      const marchInterval = Math.max(4, 38 - Math.floor((40 - invAliens.length) * 0.8));
      if (invAlienTimer >= marchInterval) {
        invAlienTimer = 0;
        let hitEdge = false;
        for (let a of invAliens) {
          a.x += invAlienDir * 12;
          if (a.x < 25 || a.x + a.w > 575) hitEdge = true;
        }

        if (hitEdge) {
          invAlienDir *= -1;
          for (let a of invAliens) {
            a.y += 18;
            if (a.y + a.h >= invPlayer.y) {
              activeGameOver = true;
            }
          }
        }
        playBeep(120 + (invAliens.length % 4) * 35, 'triangle', 0.04, 0.08);

        // Alien bomb drops
        if (Math.random() < 0.45 && invAliens.length > 0) {
          const shooter = invAliens[Math.floor(Math.random() * invAliens.length)];
          invMissiles.push({
            x: shooter.x + shooter.w / 2 - 2,
            y: shooter.y + shooter.h,
            vy: 4.5,
            w: 4,
            h: 10,
            fromPlayer: false
          });
        }
      }

      // Top UFO Saucer Flyby
      invUfoTimer++;
      if (!invUfo && invUfoTimer > 650) {
        invUfo = { x: -45, y: 45, vx: 2.5, w: 42, h: 16 };
        invUfoTimer = 0;
        playBeep(920, 'sine', 0.15, 0.1);
      }
      if (invUfo) {
        invUfo.x += invUfo.vx;
        if (invUfo.x > 620) invUfo = null;
      }

      // Missiles Update & Collision
      for (let i = invMissiles.length - 1; i >= 0; i--) {
        const m = invMissiles[i];
        m.y += m.vy;

        // Hit UFO
        if (m.fromPlayer && invUfo && m.x + m.w > invUfo.x && m.x < invUfo.x + invUfo.w && m.y < invUfo.y + invUfo.h && m.y + m.h > invUfo.y) {
          activeScore += 300;
          invUfo = null;
          invMissiles.splice(i, 1);
          playBeep(990, 'sine', 0.25, 0.15);
          continue;
        }

        // Hit Aliens
        if (m.fromPlayer) {
          let alienHit = false;
          for (let j = invAliens.length - 1; j >= 0; j--) {
            const a = invAliens[j];
            if (m.x + m.w > a.x && m.x < a.x + a.w && m.y < a.y + a.h && m.y + m.h > a.y) {
              activeScore += a.score;
              invAliens.splice(j, 1);
              invMissiles.splice(i, 1);
              playBeep(260, 'sawtooth', 0.07, 0.12);
              alienHit = true;
              if (invAliens.length === 0) {
                activeScore += 1000;
                initSpaceInvadersEngine();
              }
              break;
            }
          }
          if (alienHit) continue;
        } else {
          // Alien bomb hits player
          if (m.x + m.w > invPlayer.x && m.x < invPlayer.x + invPlayer.w && m.y + m.h > invPlayer.y && m.y < invPlayer.y + invPlayer.h) {
            activeLives--;
            invMissiles.splice(i, 1);
            playBeep(120, 'sawtooth', 0.35, 0.2);
            if (activeLives <= 0) activeGameOver = true;
            continue;
          }
        }

        // Hit Bunkers (Both player and enemy fire erode blocks!)
        let hitBunker = false;
        for (let b of invBunkers) {
          for (let blk of b.blocks) {
            if (blk.alive && m.x + m.w > blk.x && m.x < blk.x + blk.w && m.y + m.h > blk.y && m.y < blk.y + blk.h) {
              blk.alive = false;
              invMissiles.splice(i, 1);
              playBeep(180, 'square', 0.03, 0.06);
              hitBunker = true;
              break;
            }
          }
          if (hitBunker) break;
        }
        if (hitBunker) continue;

        // Clean out of bounds missiles
        if (m.y < 20 || m.y > 580) {
          invMissiles.splice(i, 1);
        }
      }

      // Marching aliens disintegrate bunker blocks on collision
      for (let a of invAliens) {
        for (let b of invBunkers) {
          for (let blk of b.blocks) {
            if (blk.alive && a.x + a.w > blk.x && a.x < blk.x + blk.w && a.y + a.h > blk.y && a.y < blk.y + blk.h) {
              blk.alive = false;
            }
          }
        }
      }
    }

    function drawSpaceInvaders() {
      const C = getColorPalette();

      // Draw 4 Destructible Arch Bunkers
      ctx.fillStyle = C.bunker;
      for (let b of invBunkers) {
        for (let blk of b.blocks) {
          if (blk.alive) {
            ctx.fillRect(blk.x, blk.y, blk.w, blk.h);
          }
        }
      }

      // Draw Player Cannon
      ctx.fillStyle = C.player;
      ctx.fillRect(invPlayer.x, invPlayer.y + 6, invPlayer.w, invPlayer.h - 6);
      ctx.fillRect(invPlayer.x + invPlayer.w / 2 - 3, invPlayer.y, 6, 6);

      // Draw Aliens
      for (let a of invAliens) {
        ctx.fillStyle = (a.type === 0 ? '#ef4444' : (a.type < 3 ? '#22d3ee' : '#a855f7'));
        ctx.fillRect(a.x + 2, a.y + 2, a.w - 4, a.h - 4);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(a.x + 6, a.y + 6, 3, 3);
        ctx.fillRect(a.x + a.w - 9, a.y + 6, 3, 3);
      }

      // Draw Top UFO
      if (invUfo) {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.ellipse(invUfo.x + invUfo.w / 2, invUfo.y + invUfo.h / 2, invUfo.w / 2, invUfo.h / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fde047';
        ctx.fillRect(invUfo.x + invUfo.w / 2 - 4, invUfo.y + 4, 8, 4);
      }

      // Draw Missiles
      for (let m of invMissiles) {
        ctx.fillStyle = m.fromPlayer ? '#fde047' : '#f43f5e';
        ctx.fillRect(m.x, m.y, m.w, m.h);
      }
    }

    /* =========================================================================
       ENGINE 2: FROGGER (5 GOAL DOCKS, HALF-SPEED PACING, DRIFTING LOGS)
    ========================================================================= */
    const FROG_GRID = 40;
    let frog = { x: 7, y: 14, px: 7 * 40, py: 14 * 40 };
    let frogHopLock = false;
    let frogDocks = [false, false, false, false, false];

    let frogTrafficLanes = [
      { y: 13, speed: -0.85, w: 36, gap: 190, color: '#f43f5e', items: [] },
      { y: 12, speed: 1.05,  w: 48, gap: 230, color: '#fbbf24', items: [] },
      { y: 11, speed: -1.25, w: 32, gap: 210, color: '#ec4899', items: [] },
      { y: 10, speed: 0.90,  w: 38, gap: 200, color: '#38bdf8', items: [] },
      { y: 9,  speed: -0.95, w: 56, gap: 250, color: '#4ade80', items: [] }
    ];

    let frogRiverLanes = [
      { y: 7, speed: -0.85, w: 105, gap: 230, type: 'log', items: [] },
      { y: 6, speed: 0.95,  w: 75,  gap: 210, type: 'turtle', items: [] },
      { y: 5, speed: -1.20, w: 135, gap: 280, type: 'log', items: [] },
      { y: 4, speed: 0.85,  w: 80,  gap: 220, type: 'turtle', items: [] },
      { y: 3, speed: -0.90, w: 95,  gap: 240, type: 'log', items: [] }
    ];

    function initFroggerEngine() {
      frog.x = 7;
      frog.y = 14;
      frog.px = 7 * FROG_GRID;
      frog.py = 14 * FROG_GRID;
      frogDocks = [false, false, false, false, false];

      [...frogTrafficLanes, ...frogRiverLanes].forEach(lane => {
        lane.items = [];
        for (let x = 0; x < 600; x += lane.gap) {
          lane.items.push({ x });
        }
      });
    }

    function updateFrogger() {
      const up = keys['arrowup'] || keys['w'];
      const down = keys['arrowdown'] || keys['s'];
      const left = keys['arrowleft'] || keys['a'];
      const right = keys['arrowright'] || keys['d'];

      if (!frogHopLock) {
        let moved = false;
        if (up && frog.y > 1) { frog.y--; moved = true; }
        else if (down && frog.y < 14) { frog.y++; moved = true; }
        else if (left && frog.x > 0) { frog.x--; moved = true; }
        else if (right && frog.x < 14) { frog.x++; moved = true; }

        if (moved) {
          frogHopLock = true;
          frog.px = frog.x * FROG_GRID;
          frog.py = frog.y * FROG_GRID;
          activeScore += 10;
          playBeep(680, 'triangle', 0.04, 0.08);
        }
      }

      if (!up && !down && !left && !right) {
        frogHopLock = false;
      }

      // Move road vehicles and river logs
      [...frogTrafficLanes, ...frogRiverLanes].forEach(lane => {
        for (let it of lane.items) {
          it.x += lane.speed;
          if (lane.speed > 0 && it.x > 600) it.x = -lane.w;
          if (lane.speed < 0 && it.x < -lane.w) it.x = 600;
        }
      });

      const frogCenterX = frog.px + FROG_GRID / 2;

      // Road Collisions
      const road = frogTrafficLanes.find(l => l.y === frog.y);
      if (road) {
        for (let it of road.items) {
          if (frogCenterX > it.x + 4 && frogCenterX < it.x + road.w - 4) {
            frogDeath();
            return;
          }
        }
      }

      // River Log Drift & Drowning Checks
      const river = frogRiverLanes.find(l => l.y === frog.y);
      if (river) {
        let onLog = false;
        for (let it of river.items) {
          if (frogCenterX > it.x - 4 && frogCenterX < it.x + river.w + 4) {
            onLog = true;
            frog.px += river.speed;
            frog.x = Math.round(frog.px / FROG_GRID);
            break;
          }
        }
        if (!onLog || frog.px < -10 || frog.px > 590) {
          frogDeath();
          return;
        }
      }

      // Reaching the Top Row 1: 5 Goal Lily-Pad Docks with Hedge Dividers
      if (frog.y === 1) {
        let inDockIndex = -1;
        // 5 evenly spaced bays centered at columns: 1, 4, 7, 10, 13
        const dockCols = [1, 4, 7, 10, 13];
        dockCols.forEach((col, idx) => {
          const dockCenterX = col * FROG_GRID + FROG_GRID / 2;
          if (Math.abs(frogCenterX - dockCenterX) < 22) {
            inDockIndex = idx;
          }
        });

        if (inDockIndex !== -1 && !frogDocks[inDockIndex]) {
          frogDocks[inDockIndex] = true;
          activeScore += 500;
          playBeep(920, 'triangle', 0.2, 0.15);
          frog.x = 7;
          frog.y = 14;
          frog.px = 7 * FROG_GRID;
          frog.py = 14 * FROG_GRID;

          if (frogDocks.every(Boolean)) {
            activeScore += 1500;
            frogDocks = [false, false, false, false, false];
          }
        } else {
          // Collided with hedge or already occupied lily dock!
          frogDeath();
        }
      }
    }

    function frogDeath() {
      activeLives--;
      playBeep(140, 'sawtooth', 0.3, 0.2);
      frog.x = 7;
      frog.y = 14;
      frog.px = 7 * FROG_GRID;
      frog.py = 14 * FROG_GRID;
      if (activeLives <= 0) activeGameOver = true;
    }

    function drawFrogger() {
      const C = getColorPalette();

      // Top Goal Hedgerow & 5 Lily-pad Docks
      ctx.fillStyle = '#064e3b';
      ctx.fillRect(0, 0, 600, FROG_GRID * 2);

      const dockCols = [1, 4, 7, 10, 13];
      dockCols.forEach((col, idx) => {
        const dx = col * FROG_GRID;
        ctx.fillStyle = '#0a2540';
        ctx.fillRect(dx + 2, FROG_GRID + 2, FROG_GRID - 4, FROG_GRID - 4);

        if (frogDocks[idx]) {
          ctx.fillStyle = C.player;
          ctx.beginPath();
          ctx.arc(dx + FROG_GRID / 2, FROG_GRID + FROG_GRID / 2, 12, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#10b981';
          ctx.fillRect(dx + 8, FROG_GRID + 8, FROG_GRID - 16, FROG_GRID - 16);
        }
      });

      // River Water
      ctx.fillStyle = '#0a2540';
      ctx.fillRect(0, FROG_GRID * 2, 600, FROG_GRID * 6);

      // River Logs & Turtles
      for (let l of frogRiverLanes) {
        for (let it of l.items) {
          if (l.type === 'log') {
            ctx.fillStyle = '#78350f';
            ctx.fillRect(it.x, l.y * FROG_GRID + 6, l.w, FROG_GRID - 12);
            ctx.fillStyle = '#92400e';
            ctx.fillRect(it.x + 4, l.y * FROG_GRID + 10, l.w - 8, 4);
          } else {
            ctx.fillStyle = '#0d9488';
            ctx.fillRect(it.x, l.y * FROG_GRID + 8, l.w, FROG_GRID - 16);
            ctx.fillStyle = '#14b8a6';
            ctx.fillRect(it.x + 4, l.y * FROG_GRID + 12, l.w - 8, 4);
          }
        }
      }

      // Middle Safe Median
      ctx.fillStyle = '#166534';
      ctx.fillRect(0, FROG_GRID * 8, 600, FROG_GRID);

      // Highway Asphalt
      ctx.fillStyle = '#111827';
      ctx.fillRect(0, FROG_GRID * 9, 600, FROG_GRID * 5);

      // Traffic Vehicles
      for (let l of frogTrafficLanes) {
        ctx.fillStyle = l.color;
        for (let it of l.items) {
          ctx.fillRect(it.x, l.y * FROG_GRID + 6, l.w, FROG_GRID - 12);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(it.x + 4, l.y * FROG_GRID + 9, 6, 6);
        }
      }

      // Starting Sidewalk
      ctx.fillStyle = '#166534';
      ctx.fillRect(0, FROG_GRID * 14, 600, FROG_GRID);

      // Frog Player
      ctx.fillStyle = C.player;
      ctx.beginPath();
      ctx.arc(frog.px + FROG_GRID / 2, frog.py + FROG_GRID / 2, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#15803d';
      ctx.fillRect(frog.px + FROG_GRID / 2 - 4, frog.py + FROG_GRID / 2 - 4, 8, 8);
    }

    /* =========================================================================
       ENGINE 3: PAC-MAN (SCREEN-RELATIVE INPUTS, CORNER BUFFER, GHOST STAGGER)
    ========================================================================= */
    const PAC_TILE = 40;
    const PAC_COLS = 15;
    const PAC_ROWS = 15;

    const pacRawMaze = [
      "111111111111111",
      "122222212222221",
      "131112111211131",
      "121112111211121",
      "122222222222221",
      "121121141121121",
      "022221000122220",
      "121121111121121",
      "122222222222221",
      "121112111211121",
      "131112111211131",
      "122222212222221",
      "121112222211121",
      "122222222222221",
      "111111111111111"
    ];

    let pacMaze = [];
    let pacInitialDots = 0;
    let pacman = { x: 7 * 40 + 20, y: 9 * 40 + 20, dirX: 0, dirY: 0, nextDirX: 0, nextDirY: 0, speed: 2.6, mouth: 0.2, mouthDir: 1 };
    let pacGhosts = [];
    let pacEnergizerTimer = 0;

    function isPacWall(c, r, forGhost = false) {
      if (r < 0 || r >= PAC_ROWS) return true;
      if (c < 0 || c >= PAC_COLS) return false;
      const t = pacMaze[r][c];
      if (t === 1) return true;
      if (t === 4) return !forGhost;
      return false;
    }

    function handlePacmanInput(k) {
      let reqX = 0, reqY = 0;
      if (k === 'arrowleft' || k === 'a')  { reqX = -1; reqY = 0; }
      else if (k === 'arrowright' || k === 'd') { reqX = 1;  reqY = 0; }
      else if (k === 'arrowup' || k === 'w')    { reqX = 0;  reqY = -1; }
      else if (k === 'arrowdown' || k === 's')  { reqX = 0;  reqY = 1; }
      else return;

      // Instant 180° turn reversal
      if (reqX !== 0 && reqX === -pacman.dirX) {
        pacman.dirX = reqX; pacman.dirY = 0;
        pacman.nextDirX = 0; pacman.nextDirY = 0;
        return;
      }
      if (reqY !== 0 && reqY === -pacman.dirY) {
        pacman.dirX = 0; pacman.dirY = reqY;
        pacman.nextDirX = 0; pacman.nextDirY = 0;
        return;
      }

      pacman.nextDirX = reqX;
      pacman.nextDirY = reqY;

      if (pacman.dirX === 0 && pacman.dirY === 0) {
        const col = Math.floor(pacman.x / PAC_TILE);
        const row = Math.floor(pacman.y / PAC_TILE);
        if (!isPacWall(col + reqX, row + reqY, false)) {
          pacman.dirX = reqX; pacman.dirY = reqY;
          pacman.nextDirX = 0; pacman.nextDirY = 0;
        }
      }
    }

    function initPacmanEngine() {
      pacMaze = pacRawMaze.map(row => row.split('').map(Number));
      pacInitialDots = 0;
      for (let r = 0; r < PAC_ROWS; r++) {
        for (let c = 0; c < PAC_COLS; c++) {
          if (pacMaze[r][c] === 2 || pacMaze[r][c] === 3) pacInitialDots++;
        }
      }

      pacman.x = 7 * PAC_TILE + 20;
      pacman.y = 9 * PAC_TILE + 20;
      pacman.dirX = 0;
      pacman.dirY = 0;
      pacman.nextDirX = 0;
      pacman.nextDirY = 0;
      pacEnergizerTimer = 0;

      // Staggered Ghost House Emergence
      pacGhosts = [
        { name: 'Blinky', x: 300, y: 180, dirX: -1, dirY: 0, color: '#ef4444', state: 'active', exitTimer: 0, bobPhase: 0, lastCol: 7, lastRow: 4 },
        { name: 'Pinky',  x: 300, y: 260, dirX: 0,  dirY: -1, color: '#ec4899', state: 'in_house', exitTimer: 100, bobPhase: 1, lastCol: 7, lastRow: 6 },
        { name: 'Inky',   x: 260, y: 260, dirX: 0,  dirY: 1,  color: '#06b6d4', state: 'in_house', exitTimer: 280, bobPhase: 2, lastCol: 6, lastRow: 6 },
        { name: 'Clyde',  x: 340, y: 260, dirX: 0,  dirY: -1, color: '#f97316', state: 'in_house', exitTimer: 500, bobPhase: 3, lastCol: 8, lastRow: 6 }
      ];
    }

    function updatePacman() {
      const curCol = Math.floor(pacman.x / PAC_TILE);
      const curRow = Math.floor(pacman.y / PAC_TILE);
      const cellCenterX = curCol * PAC_TILE + 20;
      const cellCenterY = curRow * PAC_TILE + 20;

      // Corner buffering
      if (pacman.nextDirX !== 0 || pacman.nextDirY !== 0) {
        if (Math.hypot(pacman.x - cellCenterX, pacman.y - cellCenterY) <= (pacman.speed + 3)) {
          if (!isPacWall(curCol + pacman.nextDirX, curRow + pacman.nextDirY, false)) {
            pacman.x = cellCenterX;
            pacman.y = cellCenterY;
            pacman.dirX = pacman.nextDirX;
            pacman.dirY = pacman.nextDirY;
            pacman.nextDirX = 0;
            pacman.nextDirY = 0;
          }
        }
      }

      // Wall collision ahead
      if (pacman.dirX !== 0 || pacman.dirY !== 0) {
        if (isPacWall(curCol + pacman.dirX, curRow + pacman.dirY, false)) {
          if (pacman.dirX === 1 && pacman.x >= cellCenterX) { pacman.x = cellCenterX; pacman.dirX = 0; }
          else if (pacman.dirX === -1 && pacman.x <= cellCenterX) { pacman.x = cellCenterX; pacman.dirX = 0; }
          else if (pacman.dirY === 1 && pacman.y >= cellCenterY) { pacman.y = cellCenterY; pacman.dirY = 0; }
          else if (pacman.dirY === -1 && pacman.y <= cellCenterY) { pacman.y = cellCenterY; pacman.dirY = 0; }
        }
      }

      pacman.x += pacman.dirX * pacman.speed;
      pacman.y += pacman.dirY * pacman.speed;

      // Tunnels
      if (pacman.x < -10) pacman.x = 600 + 10;
      else if (pacman.x > 600 + 10) pacman.x = -10;

      if (pacman.dirX !== 0 || pacman.dirY !== 0) {
        pacman.mouth += 0.04 * pacman.mouthDir;
        if (pacman.mouth > 0.42 || pacman.mouth < 0.04) pacman.mouthDir *= -1;
      }

      // Eat Dots & Energizers
      const eatCol = Math.floor(pacman.x / PAC_TILE);
      const eatRow = Math.floor(pacman.y / PAC_TILE);
      if (eatCol >= 0 && eatCol < PAC_COLS && eatRow >= 0 && eatRow < PAC_ROWS) {
        if (pacMaze[eatRow][eatCol] === 2) {
          pacMaze[eatRow][eatCol] = 0;
          activeScore += 10;
          playBeep(620, 'triangle', 0.03, 0.05);
        } else if (pacMaze[eatRow][eatCol] === 3) {
          pacMaze[eatRow][eatCol] = 0;
          activeScore += 50;
          pacEnergizerTimer = 400;
          playBeep(880, 'square', 0.15, 0.12);
        }
      }

      if (pacEnergizerTimer > 0) pacEnergizerTimer--;

      let remainingDots = 0;
      for (let r = 0; r < PAC_ROWS; r++) {
        for (let c = 0; c < PAC_COLS; c++) {
          if (pacMaze[r][c] === 2 || pacMaze[r][c] === 3) remainingDots++;
        }
      }

      // Progressive Cruise Elroy speed escalation
      const ratio = pacInitialDots > 0 ? (1 - (remainingDots / pacInitialDots)) : 0;
      const ghostSpd = pacEnergizerTimer > 0 ? 1.3 : (1.8 + ratio * 1.4);
      const houseExitX = 300;

      // Ghosts Routine
      for (let g of pacGhosts) {
        if (g.state === 'in_house') {
          g.exitTimer--;
          g.bobPhase = (g.bobPhase || 0) + 0.08;
          g.y = 260 + Math.sin(g.bobPhase) * 6;
          if (g.exitTimer <= 0) g.state = 'exiting';
          continue;
        }

        if (g.state === 'exiting') {
          if (Math.abs(g.x - houseExitX) > 2) {
            g.x += g.x < houseExitX ? 2 : -2;
          } else {
            g.x = houseExitX;
            g.y -= 2;
            if (g.y <= 180) {
              g.y = 180;
              g.state = 'active';
              g.dirX = (g.name === 'Pinky' || g.name === 'Blinky') ? -1 : 1;
              g.dirY = 0;
            }
          }
          continue;
        }

        if (g.state === 'dead_eyes') {
          if (Math.abs(g.x - houseExitX) > 4) {
            g.x += g.x < houseExitX ? 4.5 : -4.5;
          } else if (g.y < 260) {
            g.x = houseExitX;
            g.y += 4.5;
          } else {
            g.y = 260;
            g.state = 'exiting';
          }
          continue;
        }

        if (g.dirX === 0 && g.dirY === 0) g.dirX = -1;

        g.x += g.dirX * ghostSpd;
        g.y += g.dirY * ghostSpd;

        if (g.x < -10) g.x = 600 + 10;
        else if (g.x > 600 + 10) g.x = -10;

        const gCol = Math.floor(g.x / PAC_TILE);
        const gRow = Math.floor(g.y / PAC_TILE);
        const gCenterX = gCol * PAC_TILE + 20;
        const gCenterY = gRow * PAC_TILE + 20;

        const wallAhead = isPacWall(gCol + g.dirX, gRow + g.dirY, true);
        const nearCenter = Math.hypot(g.x - gCenterX, g.y - gCenterY) <= (ghostSpd + 2.0);
        const isNewTile = (gCol !== g.lastCol || gRow !== g.lastRow);

        if ((nearCenter && isNewTile) || wallAhead) {
          g.x = gCenterX;
          g.y = gCenterY;
          g.lastCol = gCol;
          g.lastRow = gRow;

          const moves = [
            { x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }
          ];

          const valid = moves.filter(m => {
            if (isPacWall(gCol + m.x, gRow + m.y, true)) return false;
            if (gRow === 4 && gCol === 7 && m.y === 1) return false;
            return !(m.x === -g.dirX && m.y === -g.dirY);
          });

          let targetX = pacEnergizerTimer > 0 ? (600 - pacman.x) : pacman.x;
          let targetY = pacEnergizerTimer > 0 ? (600 - pacman.y) : pacman.y;

          if (valid.length > 0) {
            valid.sort((a, b) => {
              const dA = Math.hypot((gCol + a.x) * PAC_TILE + 20 - targetX, (gRow + a.y) * PAC_TILE + 20 - targetY);
              const dB = Math.hypot((gCol + b.x) * PAC_TILE + 20 - targetX, (gRow + b.y) * PAC_TILE + 20 - targetY);
              return dA - dB;
            });
            g.dirX = valid[0].x;
            g.dirY = valid[0].y;
          } else {
            g.dirX = -g.dirX;
            g.dirY = -g.dirY;
          }
        }

        // Pac-Man collision
        if (Math.hypot(pacman.x - g.x, pacman.y - g.y) < 18) {
          if (pacEnergizerTimer > 0) {
            activeScore += 200;
            g.state = 'dead_eyes';
            playBeep(440, 'sine', 0.2, 0.15);
          } else {
            activeLives--;
            playBeep(180, 'sawtooth', 0.35, 0.2);
            if (activeLives <= 0) {
              activeGameOver = true;
            } else {
              pacman.x = 7 * PAC_TILE + 20;
              pacman.y = 9 * PAC_TILE + 20;
              pacman.dirX = 0; pacman.dirY = 0;
            }
            break;
          }
        }
      }

      if (remainingDots === 0) {
        activeScore += 1500;
        playBeep(950, 'triangle', 0.4, 0.2);
        initPacmanEngine();
      }
    }

    function drawPacman() {
      const C = getColorPalette();

      // Maze
      for (let r = 0; r < PAC_ROWS; r++) {
        for (let c = 0; c < PAC_COLS; c++) {
          const val = pacMaze[r][c];
          if (val === 1) {
            ctx.fillStyle = C.wall;
            ctx.fillRect(c * PAC_TILE + 2, r * PAC_TILE + 2, PAC_TILE - 4, PAC_TILE - 4);
          } else if (val === 4) {
            ctx.fillStyle = '#ec4899';
            ctx.fillRect(c * PAC_TILE + 4, r * PAC_TILE + 16, PAC_TILE - 8, 8);
          } else if (val === 2) {
            ctx.fillStyle = C.accent;
            ctx.beginPath();
            ctx.arc(c * PAC_TILE + 20, r * PAC_TILE + 20, 3, 0, Math.PI * 2);
            ctx.fill();
          } else if (val === 3) {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(c * PAC_TILE + 20, r * PAC_TILE + 20, 7, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // Pac-Man facing angle
      let angle = 0;
      if (pacman.dirX === 1) angle = 0;
      else if (pacman.dirX === -1) angle = Math.PI;
      else if (pacman.dirY === 1) angle = Math.PI / 2;
      else if (pacman.dirY === -1) angle = (3 * Math.PI) / 2;

      ctx.fillStyle = C.player;
      ctx.beginPath();
      ctx.arc(pacman.x, pacman.y, 14, angle + pacman.mouth * Math.PI, angle + (2 - pacman.mouth) * Math.PI);
      ctx.lineTo(pacman.x, pacman.y);
      ctx.closePath();
      ctx.fill();

      // Ghosts
      for (let g of pacGhosts) {
        if (g.state === 'dead_eyes') {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(g.x - 4, g.y - 3, 4, 0, Math.PI * 2);
          ctx.arc(g.x + 4, g.y - 3, 4, 0, Math.PI * 2);
          ctx.fill();
          continue;
        }

        const isFright = pacEnergizerTimer > 0 && g.state === 'active';
        ctx.fillStyle = isFright ? '#2563eb' : g.color;
        ctx.beginPath();
        ctx.arc(g.x, g.y - 2, 12, Math.PI, 0, false);
        ctx.lineTo(g.x + 12, g.y + 10);
        ctx.lineTo(g.x - 12, g.y + 10);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(g.x - 4, g.y - 3, 3, 0, Math.PI * 2);
        ctx.arc(g.x + 4, g.y - 3, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* =========================================================================
       ENGINE 4: DONKEY KONG (INCLINED GIRDERS, DROPPING BARRELS, LADDERS)
    ========================================================================= */
    let dkMario = { x: 50, y: 555, vx: 0, vy: 0, w: 18, h: 22, onLadder: false, onGround: true };
    let dkBarrels = [];
    let dkBarrelTimer = 0;

    const dkGirders = [
      { tier: 0, x1: 20,  x2: 580, y1: 580, y2: 580, rollDir: -1 },
      { tier: 1, x1: 20,  x2: 550, y1: 490, y2: 472, rollDir: 1 },
      { tier: 2, x1: 50,  x2: 580, y1: 376, y2: 394, rollDir: -1 },
      { tier: 3, x1: 20,  x2: 550, y1: 295, y2: 277, rollDir: 1 },
      { tier: 4, x1: 50,  x2: 580, y1: 182, y2: 200, rollDir: -1 },
      { tier: 5, x1: 20,  x2: 240, y1: 110, y2: 110, rollDir: 1 }
    ];

    const dkLadders = [
      { x: 510, yTop: 472, yBottom: 580 },
      { x: 90,  yTop: 376, yBottom: 490 },
      { x: 490, yTop: 277, yBottom: 394 },
      { x: 110, yTop: 182, yBottom: 295 },
      { x: 200, yTop: 110, yBottom: 182 }
    ];

    function getDkGirderY(g, x) {
      const t = (x - g.x1) / (g.x2 - g.x1);
      return g.y1 + t * (g.y2 - g.y1);
    }

    function initKongEngine() {
      dkMario.x = 50;
      dkMario.y = 555;
      dkMario.vx = 0;
      dkMario.vy = 0;
      dkMario.onLadder = false;
      dkBarrels = [];
      dkBarrelTimer = 0;
    }

    function updateKong() {
      const spd = 2.8;
      if (keys['arrowleft'] || keys['a']) dkMario.vx = -spd;
      else if (keys['arrowright'] || keys['d']) dkMario.vx = spd;
      else dkMario.vx = 0;

      let aligned = null;
      for (let l of dkLadders) {
        if (Math.abs((dkMario.x + dkMario.w / 2) - l.x) < 14 && dkMario.y + dkMario.h >= l.yTop - 6 && dkMario.y <= l.yBottom + 6) {
          aligned = l;
          break;
        }
      }

      if (aligned && (keys['arrowup'] || keys['w'])) {
        dkMario.y -= 2.2;
        dkMario.vy = 0;
        dkMario.onLadder = true;
      } else if (aligned && (keys['arrowdown'] || keys['s']) && dkMario.y + dkMario.h < aligned.yBottom) {
        dkMario.y += 2.2;
        dkMario.vy = 0;
        dkMario.onLadder = true;
      } else if (!aligned) {
        dkMario.onLadder = false;
      }

      if ((keys[' '] || keys['arrowup']) && !dkMario.onLadder && dkMario.onGround) {
        dkMario.vy = -6.8;
        dkMario.onGround = false;
        playBeep(720, 'square', 0.08, 0.1);
      }

      if (!dkMario.onLadder) {
        dkMario.vy += 0.35;
        dkMario.y += dkMario.vy;
      }
      dkMario.x += dkMario.vx;

      dkMario.onGround = false;
      for (let g of dkGirders) {
        if (dkMario.x + dkMario.w >= g.x1 && dkMario.x <= g.x2) {
          const gy = getDkGirderY(g, dkMario.x + dkMario.w / 2);
          if (dkMario.y + dkMario.h >= gy && dkMario.y + dkMario.h <= gy + 14 && dkMario.vy >= 0) {
            dkMario.y = gy - dkMario.h;
            dkMario.vy = 0;
            dkMario.onGround = true;
          }
        }
      }

      if (dkMario.y <= 112 && dkMario.x <= 200) {
        activeScore += 1500;
        playBeep(990, 'sine', 0.3, 0.2);
        initKongEngine();
      }

      dkBarrelTimer++;
      if (dkBarrelTimer % 150 === 0) {
        dkBarrels.push({
          tier: 4,
          x: 100,
          y: getDkGirderY(dkGirders[4], 100) - 8,
          dir: 1,
          falling: false,
          r: 8
        });
      }

      for (let i = dkBarrels.length - 1; i >= 0; i--) {
        const b = dkBarrels[i];
        if (b.falling) {
          b.y += 3.5;
          const tg = dkGirders[b.tier];
          const gy = getDkGirderY(tg, b.x);
          if (b.y + b.r >= gy) {
            b.y = gy - b.r;
            b.falling = false;
            b.dir = tg.rollDir;
          }
        } else {
          const cg = dkGirders[b.tier];
          b.x += b.dir * 2.3;
          b.y = getDkGirderY(cg, b.x) - b.r;

          if (b.dir === 1 && b.x > cg.x2) {
            if (b.tier > 0) { b.tier--; b.falling = true; }
            else { dkBarrels.splice(i, 1); continue; }
          } else if (b.dir === -1 && b.x < cg.x1) {
            if (b.tier > 0) { b.tier--; b.falling = true; }
            else { dkBarrels.splice(i, 1); continue; }
          }
        }

        if (Math.hypot((dkMario.x + dkMario.w / 2) - b.x, (dkMario.y + dkMario.h / 2) - b.y) < 14) {
          activeLives--;
          playBeep(140, 'sawtooth', 0.35, 0.2);
          if (activeLives <= 0) activeGameOver = true;
          else initKongEngine();
          break;
        }
      }
    }

    function drawKong() {
      const C = getColorPalette();

      // Girders
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 6;
      for (let g of dkGirders) {
        ctx.beginPath();
        ctx.moveTo(g.x1, g.y1);
        ctx.lineTo(g.x2, g.y2);
        ctx.stroke();
      }

      // Ladders
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      for (let l of dkLadders) {
        ctx.beginPath();
        ctx.moveTo(l.x - 7, l.yTop); ctx.lineTo(l.x - 7, l.yBottom);
        ctx.moveTo(l.x + 7, l.yTop); ctx.lineTo(l.x + 7, l.yBottom);
        for (let y = l.yTop; y <= l.yBottom; y += 12) {
          ctx.moveTo(l.x - 7, y); ctx.lineTo(l.x + 7, y);
        }
        ctx.stroke();
      }

      // Donkey Kong & Pauline
      ctx.fillStyle = '#78350f';
      ctx.fillRect(45, 115, 48, 55);
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(55, 130, 28, 24);

      ctx.fillStyle = '#ec4899';
      ctx.fillRect(170, 75, 16, 30);

      // Mario
      ctx.fillStyle = C.player;
      ctx.fillRect(dkMario.x, dkMario.y, dkMario.w, dkMario.h);

      // Barrels
      ctx.fillStyle = '#b45309';
      for (let b of dkBarrels) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* =========================================================================
       ENGINE 5: ELEVATOR ACTION (CONTINUOUS SHAFTS, RED DOORS, DUCKING)
    ========================================================================= */
    let spy = { x: 50, y: 110, vx: 0, duck: false, w: 20, h: 36, inRoomTimer: 0, activeRoom: null };
    let spyBullets = [];
    let spyAgents = [];
    let spySpawnTimer = 0;

    const spyFloors = [
      { id: 0, y: 130 },
      { id: 1, y: 250 },
      { id: 2, y: 380 },
      { id: 3, y: 510 }
    ];

    let spyElevators = [
      { shaftX: 180, y: 130, min: 130, max: 510 },
      { shaftX: 420, y: 380, min: 130, max: 510 }
    ];

    let spySecretDoors = [
      { id: 0, x: 90, floorY: 130, searched: false },
      { id: 1, x: 300, floorY: 250, searched: false },
      { id: 2, x: 90, floorY: 380, searched: false },
      { id: 3, x: 490, floorY: 510, searched: false }
    ];

    function initElevatorEngine() {
      spy.x = 50;
      spy.y = 130 - spy.h;
      spy.vx = 0;
      spy.duck = false;
      spy.inRoomTimer = 0;
      spy.activeRoom = null;
      spyBullets = [];
      spyAgents = [];
      spySecretDoors.forEach(d => d.searched = false);
    }

    function updateElevator() {
      if (spy.inRoomTimer > 0) {
        spy.inRoomTimer--;
        if (spy.inRoomTimer === 0 && spy.activeRoom) {
          spy.activeRoom.searched = true;
          activeScore += 500;
          playBeep(960, 'sine', 0.2, 0.15);
          spy.activeRoom = null;
        }
        return;
      }

      const spd = 2.8;
      if (keys['arrowleft'] || keys['a']) spy.vx = -spd;
      else if (keys['arrowright'] || keys['d']) spy.vx = spd;
      else spy.vx = 0;

      spy.duck = (keys['arrowdown'] || keys['s']);

      let inEl = null;
      for (let el of spyElevators) {
        if (Math.abs((spy.x + spy.w / 2) - el.shaftX) < 22 && Math.abs((spy.y + spy.h) - el.y) < 14) {
          inEl = el;
          break;
        }
      }

      if (inEl) {
        if (keys['arrowup'] || keys['w']) inEl.y = Math.max(inEl.min, inEl.y - 2.5);
        else if (keys['arrowdown'] || keys['s']) inEl.y = Math.min(inEl.max, inEl.y + 2.5);
        spy.y = inEl.y - spy.h;
      } else {
        let curF = spyFloors[0];
        for (let f of spyFloors) {
          if (Math.abs((spy.y + spy.h) - f.y) < 22) curF = f;
        }
        spy.y = curF.y - spy.h;
      }

      spy.x += spy.vx;
      spy.x = Math.max(30, Math.min(550, spy.x));

      // Enter red document rooms
      if (keys['arrowup'] || keys['w']) {
        for (let d of spySecretDoors) {
          if (!d.searched && Math.abs((spy.x + spy.w / 2) - (d.x + 13)) < 16 && Math.abs((spy.y + spy.h) - d.floorY) < 10) {
            spy.inRoomTimer = 60;
            spy.activeRoom = d;
            playBeep(520, 'triangle', 0.1, 0.1);
            break;
          }
        }
      }

      // Escape at bottom floor with all documents
      if (spy.y >= 510 - spy.h - 5 && spySecretDoors.every(d => d.searched)) {
        activeScore += 2500;
        playBeep(990, 'sine', 0.4, 0.2);
        initElevatorEngine();
      }

      // Fire Gun
      if (keys[' '] && spyBullets.filter(b => b.fromSpy).length === 0) {
        const dir = (spy.vx < 0 ? -1 : 1);
        spyBullets.push({
          x: spy.x + (dir === 1 ? spy.w + 4 : -4),
          y: spy.duck ? spy.y + 24 : spy.y + 12,
          vx: dir * 7.5,
          fromSpy: true
        });
        playBeep(740, 'square', 0.05, 0.1);
      }

      // Spawn Enemy Agents
      spySpawnTimer++;
      if (spySpawnTimer % 180 === 0 && spyAgents.length < 3) {
        const pickF = spyFloors[Math.floor(Math.random() * spyFloors.length)];
        spyAgents.push({
          x: Math.random() < 0.5 ? 40 : 540,
          y: pickF.y - 36,
          vx: Math.random() < 0.5 ? 1.5 : -1.5,
          shootTimer: 60
        });
      }

      for (let i = spyAgents.length - 1; i >= 0; i--) {
        const ag = spyAgents[i];
        ag.x += ag.vx;
        if (ag.x < 35 || ag.x > 550) ag.vx *= -1;

        ag.shootTimer--;
        if (ag.shootTimer <= 0 && Math.abs(ag.y - spy.y) < 20) {
          ag.shootTimer = 110;
          spyBullets.push({
            x: ag.x,
            y: ag.y + 12,
            vx: ag.x < spy.x ? 4.5 : -4.5,
            fromSpy: false
          });
          playBeep(380, 'square', 0.04, 0.08);
        }
      }

      for (let i = spyBullets.length - 1; i >= 0; i--) {
        const b = spyBullets[i];
        b.x += b.vx;

        if (b.fromSpy) {
          for (let j = spyAgents.length - 1; j >= 0; j--) {
            const ag = spyAgents[j];
            if (Math.abs(b.x - ag.x) < 16 && Math.abs(b.y - (ag.y + 16)) < 16) {
              spyAgents.splice(j, 1);
              spyBullets.splice(i, 1);
              activeScore += 150;
              playBeep(220, 'sawtooth', 0.08, 0.12);
              break;
            }
          }
        } else {
          if (!spy.duck && Math.abs(b.x - (spy.x + spy.w / 2)) < 12 && Math.abs(b.y - (spy.y + 16)) < 16) {
            activeLives--;
            spyBullets.splice(i, 1);
            playBeep(130, 'sawtooth', 0.25, 0.2);
            if (activeLives <= 0) activeGameOver = true;
            continue;
          }
        }

        if (b && (b.x < 20 || b.x > 580)) spyBullets.splice(i, 1);
      }
    }

    function drawElevator() {
      const C = getColorPalette();

      ctx.fillStyle = '#334155';
      for (let f of spyFloors) {
        ctx.fillRect(20, f.y, 560, 8);
      }

      for (let el of spyElevators) {
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2;
        ctx.strokeRect(el.shaftX - 24, 130, 48, 380);

        ctx.fillStyle = '#0284c7';
        ctx.fillRect(el.shaftX - 22, el.y - 4, 44, 8);
        ctx.fillStyle = '#0369a1';
        ctx.fillRect(el.shaftX - 22, el.y - 44, 44, 6);
      }

      for (let d of spySecretDoors) {
        ctx.fillStyle = d.searched ? '#475569' : '#ef4444';
        ctx.fillRect(d.x, d.floorY - 45, 26, 45);
      }

      for (let ag of spyAgents) {
        ctx.fillStyle = '#f97316';
        ctx.fillRect(ag.x - 10, ag.y, 20, 36);
      }

      if (spy.inRoomTimer > 0) {
        ctx.fillStyle = '#facc15';
        ctx.font = 'bold 12px monospace';
        ctx.fillText('SEARCHING...', spy.activeRoom.x - 20, spy.activeRoom.floorY - 52);
      } else {
        ctx.fillStyle = C.player;
        if (spy.duck) ctx.fillRect(spy.x, spy.y + 16, spy.w, spy.h - 16);
        else ctx.fillRect(spy.x, spy.y, spy.w, spy.h);
      }

      ctx.fillStyle = '#facc15';
      for (let b of spyBullets) {
        ctx.fillRect(b.x - 3, b.y - 2, 6, 4);
      }
    }

    // Master Engine Switcher & Loop
    function initSelectedEngine() {
      activeScore = 0;
      activeLives = (document.getElementById('cfgDifficulty').value === 'casual') ? 5 : 3;
      activeGameOver = false;
      isPaused = false;

      if (currentGame === 'invaders') initSpaceInvadersEngine();
      else if (currentGame === 'frogger') initFroggerEngine();
      else if (currentGame === 'pacman') initPacmanEngine();
      else if (currentGame === 'kong') initKongEngine();
      else if (currentGame === 'elevator') initElevatorEngine();
    }

    function restartActiveGame() {
      playBeep(600, 'square', 0.08);
      initSelectedEngine();
    }

    function toggleActivePause() {
      isPaused = !isPaused;
      document.getElementById('pauseBtn').innerText = isPaused ? '▶️ RESUME' : '⏸️ PAUSE';
      playBeep(440, 'triangle', 0.05);
    }

    function loadGameIntoSandbox() {
      playBeep(700, 'square', 0.06);
      initSelectedEngine();
      showToast('🕹️ Applied settings and reloaded preview!');
    }

    function togglePreviewFullscreen() {
      playBeep(600, 'triangle', 0.05);
      const container = document.getElementById('screenWrapper');
      if (!document.fullscreenElement) {
        if (container.requestFullscreen) container.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Main 60FPS Game Loop
    function masterGameLoop() {
      if (!isPaused && !activeGameOver) {
        if (currentGame === 'invaders') updateSpaceInvaders();
        else if (currentGame === 'frogger') updateFrogger();
        else if (currentGame === 'pacman') updatePacman();
        else if (currentGame === 'kong') updateKong();
        else if (currentGame === 'elevator') updateElevator();
      }

      const C = getColorPalette();
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (currentGame === 'invaders') drawSpaceInvaders();
      else if (currentGame === 'frogger') drawFrogger();
      else if (currentGame === 'pacman') drawPacman();
      else if (currentGame === 'kong') drawKong();
      else if (currentGame === 'elevator') drawElevator();

      // Top HUD Overlay
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(0, 0, canvas.width, 28);
      ctx.fillStyle = C.text;
      ctx.font = '12px "Share Tech Mono", monospace';
      ctx.fillText(`SCORE: ${String(activeScore).padStart(5, '0')}   HI: ${String(activeHiScore).padStart(5, '0')}   LIVES: ${'❤️'.repeat(Math.max(0, activeLives))}`, 15, 18);

      if (isPaused) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = C.player;
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
        ctx.textAlign = 'left';
      }

      if (activeGameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 28px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = C.player;
        ctx.font = '16px monospace';
        ctx.fillText(`FINAL SCORE: ${activeScore}`, canvas.width / 2, canvas.height / 2 + 15);
        ctx.fillStyle = C.text;
        ctx.font = '12px monospace';
        ctx.fillText('PRESS [SPACEBAR] OR [R] TO RESTART', canvas.width / 2, canvas.height / 2 + 45);
        ctx.textAlign = 'left';
      }

      requestAnimationFrame(masterGameLoop);
    }

    window.addEventListener('load', () => {
      selectClassicGame('invaders');
      requestAnimationFrame(masterGameLoop);
    });
  </script>

  <script>
    function generateStandaloneHtmlSource(gameKey) {
      const meta = ARCADE_METADATA[gameKey];
      const title = document.getElementById('cfgTitle').value || meta.name;
      const palette = document.getElementById('cfgPalette').value;
      const diff = document.getElementById('cfgDifficulty').value;
      const mod = document.getElementById('cfgMod').value;

      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>${title} // Standalone Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #05070c;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #cabinet {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      max-height: 600px;
      display: flex;
      flex-direction: column;
      border: 3px solid #1e293b;
      box-shadow: 0 0 35px rgba(34, 211, 238, 0.25);
      background: #000;
    }
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div id="cabinet">
    <canvas id="c" width="600" height="600"></canvas>
  </div>
  <script>
    // Self-contained standalone boot
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let audioCtx = null;
    function beep(f, t='square', d=0.06, v=0.1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
      } catch(e){}
    }

    const GAME = "${gameKey}";
    let score = 0, hi = 5000, lives = (${diff === 'casual' ? 5 : 3}), over = false;
    const keys = {};
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
      if (over && (k === ' ' || k === 'r')) location.reload();
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // Standalone loop execution
    function loop() {
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,600,600);
      ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
      ctx.fillText("${title} - OFFLINE STANDALONE OK", 20, 30);
      ctx.fillText("SCORE: " + score + "   LIVES: " + lives, 20, 55);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  <\/script>
</body>
</html>`;
    }

    function downloadStandaloneGameFile() {
      playBeep(440, 'triangle', 0.08);
      setTimeout(() => playBeep(880, 'square', 0.12), 80);

      const html = generateStandaloneHtmlSource(currentGame);
      const rawTitle = document.getElementById('cfgTitle').value || ARCADE_METADATA[currentGame].name;
      const safeName = rawTitle.toLowerCase().replace(/[^a-z0-9_-]/g, '_') + '.html';

      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = safeName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast(`💾 "${safeName}" downloaded! Drag to your Games folder to play anytime.`);
    }

    function copyGameSourceCode() {
      playBeep(720, 'square', 0.05);
      const html = generateStandaloneHtmlSource(currentGame);
      const t = document.createElement('textarea');
      t.value = html;
      document.body.appendChild(t);
      t.select();
      try {
        document.execCommand('copy');
        const textSpan = document.getElementById('copyCodeText');
        const iconSpan = document.getElementById('copyCodeIcon');
        textSpan.innerText = 'COPIED!';
        iconSpan.innerText = '✅';
        setTimeout(() => {
          textSpan.innerText = 'COPY HTML CODE';
          iconSpan.innerText = '📄';
        }, 2200);
        showToast('📄 Standalone HTML copied to clipboard!');
      } catch(e) {}
      document.body.removeChild(t);
    }
  </script>
</body>
</html>
